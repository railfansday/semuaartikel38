name: Auto Scrape & Paraphrase News

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan dijalankan manual lewat tab Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Run News Scraper
        run: |
          python import.py

      - name: Commit & Push Updated Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add database.sqlite index.html page2.html sitemap.xml robots.txt 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news, HTML, and sitemap" && git push)
